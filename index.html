<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23ff5a1f'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FoodRush — Order delicious food online. Fast delivery of pizza, biryani, burgers and more, straight to your doorstep." />
    <meta name="theme-color" content="#ff5a1f" />
    <title>FoodRush — Food Delivery, Fast &amp; Fresh</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('foodrush_settings') || '{}').theme;
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
